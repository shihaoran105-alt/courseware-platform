<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>raster</title></head>
<body>
<canvas id="c"></canvas>
<script type="module">
/* 由 server/render-pages.mjs 驱动：把 PDF 逐页画成 JPEG 交给 Node 侧取回。
   这个文件只跑在 headless Chrome 里，不是给用户看的页面。 */
import * as pdfjs from './pdf.min.mjs';
pdfjs.GlobalWorkerOptions.workerSrc = './pdf.worker.min.mjs';
// 每页指标的算法和静态版共用同一个模块，别在这里另写一份
import { statsFromOperatorList } from './page-select.mjs';

window.__PDF_PAGES = 0;
window.__PDF_ERR = '';

let doc = null;
try {
  doc = await pdfjs.getDocument({ url: './doc.pdf' }).promise;
  window.__PDF_PAGES = doc.numPages;
} catch (e) {
  window.__PDF_ERR = 'pdf.js 打开失败：' + (e && e.message ? e.message : String(e));
}

/**
 * 逐页统计「这页值不值得送给视觉模型」。
 * 只返回数字，不做判断 —— 阈值放在 page-select.mjs，方便调。
 */
window.__pageStats = async () => {
  const out = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const vp = page.getViewport({ scale: 1 });
    const opList = await page.getOperatorList();
    const s = statsFromOperatorList(opList, pdfjs.OPS, vp.width * vp.height);
    out.push({ page: p, ...s });
    page.cleanup();
  }
  return JSON.stringify(out);
};

/** 渲染指定的若干页（页码可以不连续），返回 [{page, dataUrl}] */
window.__rasterPages = async (pages, maxWidth, quality) => {
  const out = [];
  for (const p of pages) {
    if (p > doc.numPages) continue;
    const page = await doc.getPage(p);
    const base = page.getViewport({ scale: 1 });
    // 按目标宽度算缩放，避免又大又糊
    const scale = Math.min(3, Math.max(0.4, maxWidth / base.width));
    const vp = page.getViewport({ scale });
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(vp.width);
    canvas.height = Math.round(vp.height);
    const ctx = canvas.getContext('2d', { alpha: false });
    // 白底：PDF 页面本身透明的话，JPEG 会变成黑块
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    await page.render({ canvasContext: ctx, viewport: vp }).promise;
    out.push({ page: p, dataUrl: canvas.toDataURL('image/jpeg', quality) });
    canvas.width = 0;
    canvas.height = 0;
    page.cleanup();
  }
  return JSON.stringify(out);
};
</script>
</body>
</html>
