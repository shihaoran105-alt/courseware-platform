<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>课件讲解平台</title>
<meta name="description" content="上传课件，自动分析内容、讲解事例、生成教学方案，并支持在线做题与做 Lab。">
<meta name="theme-color" content="#f5f6f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<!-- iOS 装到桌面后：全屏运行、状态栏跟主题走、标题用短名 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="课件讲解">
<meta name="application-name" content="课件讲解平台">
<meta name="format-detection" content="telephone=no">
<script>
  /* 主题必须在样式生效之前定下来，否则深色用户会先看到一下白屏 */
  try {
    var t = localStorage.getItem('cw_theme');
    if (t !== 'dark' && t !== 'light') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = t;
    if (t === 'dark') {
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', '#0e1218');
    }
  } catch (e) { /* 无痕模式下 localStorage 可能不可用，忽略 */ }
</script>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%232f4b7c'/><path d='M20 8 12 4.5 4 8l8 3.5Z' fill='none' stroke='white' stroke-width='1.6' stroke-linejoin='round'/><path d='M7 9.8v4.2c0 1.1 2.2 2 5 2s5-.9 5-2V9.8' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round'/></svg>">
</head>
<body>

<div class="app">
  <header class="topbar">
    <button class="nav-btn" id="navBtn" title="项目与文件"></button>
    <div class="brand">
      <span class="logo" id="brandLogo"></span>
      <div>
        <div class="name">课件讲解平台</div>
        <div class="tag">上传课件 · 分析内容 · 讲解事例 · 落地教学</div>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="theme-btn install-btn" id="installBtn" title="安装到手机桌面" hidden></button>
    <button class="theme-btn" id="themeBtn" title="切换深色 / 浅色"></button>
    <button class="chip lang-chip" id="langChip" title="切换语言"></button>
    <span class="chip" id="modelChip">模型加载中</span>
    <button class="chip version-chip" id="versionChip" title="查看更新内容"></button>
    <span class="chip" id="keyChip">检查配置中</span>
    <button class="btn sm" id="settingsBtn"></button>
  </header>

  <div class="body">
    <aside class="sidebar">
      <!-- 项目组：EIE3333 → Lecture 1 / Tut 1 / Lab 1，每个小项目各自保存生成好的内容 -->
      <div class="sidebar-head">
        <h2>项目组</h2>
        <button class="btn sm ghost" id="newGroupBtn" title="新建项目组，例如 EIE3333">新建组</button>
      </div>
      <div class="group-list" id="groupList"></div>

      <div class="sidebar-head">
        <h2>课件文件</h2>
        <button class="btn sm ghost" id="newProjectBtn" title="在这个项目组里新建一个项目">新建</button>
      </div>
      <div class="sidebar-scroll">
        <div class="dropzone" id="dropzone">
          <span class="dz-icon" id="dzIcon"></span>
          <b>拖拽文件到这里，或点击选择</b>
          <span>PDF / PPTX / DOCX / TXT / Markdown / CSV / XLSX 等<br>可一次上传多个，单个最大 120MB</span>
        </div>
        <input type="file" id="fileInput" multiple hidden>
        <div class="upload-progress" id="uploadProgress"></div>
        <div class="file-list" id="fileList"></div>
      </div>
      <div class="sidebar-foot">
        <button class="btn primary block" id="analyzeBtn" disabled></button>
        <button class="btn block" id="exportBtn" disabled></button>
        <div class="foot-row">
          <button class="btn block" id="packBtn" title="把整个项目导出成一个文件，可以在别的平台上导入"></button>
          <button class="btn block" id="unpackBtn" title="从导出文件里导入项目或项目组"></button>
        </div>
        <input type="file" id="importInput" accept=".cwpack,.json,application/json" hidden>
      </div>
    </aside>

    <main class="main">
      <nav class="tabs" id="tabs"></nav>
      <div class="tab-body" id="tabBody"></div>
    </main>

    <!-- 右侧 AI 咨询：把左边任意内容拖进来提问 -->
    <aside class="ai-dock" id="aiDock">
      <div class="dock-head">
        <span class="dock-title" id="dockTitle">AI 咨询</span>
        <span class="spacer"></span>
        <button class="icon-btn" id="dockClear" title="清空对话"></button>
        <button class="icon-btn" id="dockToggle" title="收起 / 展开"></button>
      </div>
      <div class="dock-body" id="dockBody">
        <div class="dock-ctx" id="dockCtx"></div>
        <div class="dock-msgs" id="dockMsgs"></div>
        <div class="dock-compose">
          <textarea id="dockInput" rows="2" placeholder="把左侧任意内容拖到这里，再提问；只拖不问也可以，AI 会主动讲解"></textarea>
          <div class="dock-actions">
            <span class="dock-hint" id="dockHint">拖入内容后提问</span>
            <button class="btn sm primary" id="dockSend" disabled></button>
          </div>
        </div>
      </div>
    </aside>
  </div>
  <div class="nav-scrim" id="navScrim"></div>
</div>

<div id="presenterRoot"></div>
<div id="modalRoot"></div>
<div class="toasts" id="toasts"></div>

<script type="module">
  import * as pdfjsLib from './vendor/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdf.worker.min.mjs';
  window.pdfjsLib = pdfjsLib;
</script>
<script src="i18n-dict.js"></script>
<script src="i18n.js"></script>
<script src="icons.js"></script>
<script src="slides.js"></script>
<script src="app.js"></script>
<script src="quiz-lab.js"></script>
<script>
  /* 注册 Service Worker：装到桌面 + 断网也能进界面。
     没有 SW 也不影响使用，所以失败就静默跳过。 */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
